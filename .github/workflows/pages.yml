# Rebuild factmem.dev from README.md on every push to main.
# Source of truth is the repo docs, not a separate marketing page.

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install "markdown>=3.6.0" pytest

      - name: Build site from README
        run: python .github/scripts/build_pages.py

      - name: Check site output
        env:
          # Public IndexNow host-verification key, not a credential.
          INDEXNOW_KEY: a88a795220f4450e97a5f2486a4426f8
        run: |
          test -f _site/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          test -f "_site/${INDEXNOW_KEY}.txt"
          test "$(tr -d '\n' < "_site/${INDEXNOW_KEY}.txt")" = "${INDEXNOW_KEY}"
          test "$(tr -d '\n' < _site/CNAME)" = "factmem.dev"

      - name: Pages builder tests
        run: python -m pytest .github/scripts/test_build_pages.py -q

      # configure-pages calls the Pages API and fails while has_pages is false.
      # PRs only need a green build; publish steps run after merge (or dispatch).
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      # Public IndexNow host-verification key, not a credential.
      # Served at https://factmem.dev/{key}.txt after deploy-pages.
      INDEXNOW_KEY: a88a795220f4450e97a5f2486a4426f8
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Ping IndexNow
        # IndexNow is Bing/Yandex only. A failed ping must not fail the Pages deploy.
        continue-on-error: true
        run: |
          status=$(curl -sS -o /tmp/indexnow-body -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"factmem.dev\",\"key\":\"${INDEXNOW_KEY}\",\"keyLocation\":\"https://factmem.dev/${INDEXNOW_KEY}.txt\",\"urlList\":[\"https://factmem.dev/\"]}") || status="curl-failed"
          echo "IndexNow HTTP status: ${status}"
          cat /tmp/indexnow-body 2>/dev/null || true
          echo
          case "${status}" in
            2*) exit 0 ;;
            *) echo "IndexNow ping was not 2xx (site is already live); continuing." >&2; exit 0 ;;
          esac
