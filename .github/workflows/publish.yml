name: Publish to npm

on:
  workflow_run:
    # Must match the `name:` in release-please.yml exactly
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - name: Find unpublished release
        id: release
        run: |
          # GraphQL, not `gh api repos/.../releases/latest`. The REST call cannot
          # distinguish "no releases exist" from "could not ask": both yield an
          # empty string, and the empty string used to mean "nothing to publish,
          # exit 0 green". During a GitHub REST incident (2026-07-16) that call
          # returned empty on 5 of 5 attempts while GraphQL answered correctly —
          # so a release would have been silently skipped by a job reporting
          # success. That is the v0.4.0 failure wearing a different hat.
          #
          # A null latestRelease is a real answer (no releases yet). A failed
          # query is not an answer, and must stop the workflow rather than be
          # read as "nothing to do".
          if ! RESPONSE=$(gh api graphql -f query='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){ latestRelease{ tagName } }
            }' -F owner="${{ github.repository_owner }}" -F name="${GITHUB_REPOSITORY#*/}" 2>&1); then
            echo "::error::Could not query the latest release: ${RESPONSE}. Refusing to assume there is nothing to publish."
            exit 1
          fi
          TAG=$(echo "$RESPONSE" | jq -r '.data.repository.latestRelease.tagName // ""')
          if [ -z "$TAG" ]; then
            echo "No releases exist yet — nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${TAG#v}"
          if npm view @openmem/mcp@"$VERSION" version 2>/dev/null; then
            echo "$TAG already on npm"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG not on npm — publishing"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.release.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - if: steps.release.outputs.found == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1, and Node 22 ships npm
      # 10.x — so npm must be upgraded explicitly. That is the ONLY reason for
      # this step; keep it as long as the pinned Node ships npm < 11.5.1.
      #
      # The 11.x pin is no longer about npm 12's install-script blocking: this
      # package has no native dependencies and runs no install scripts, so npm
      # 12 is safe here. The pin simply keeps the publish path on a known-good
      # npm rather than tracking @latest through breaking changes.
      - if: steps.release.outputs.found == 'true'
        name: Upgrade npm for trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - if: steps.release.outputs.found == 'true'
        name: Install dependencies
        run: npm install  # `prepare` script runs tsc after install

      - if: steps.release.outputs.found == 'true'
        name: Run tests
        run: npm test

      # No NODE_AUTH_TOKEN: authentication comes from the OIDC id-token above,
      # matched against the Trusted Publisher configured on npmjs.com for this
      # package (owner/repo + workflow filename + environment must match exactly).
      # Provenance is generated automatically under trusted publishing.
      - if: steps.release.outputs.found == 'true'
        name: Publish ${{ steps.release.outputs.tag }}
        run: npm publish --provenance --access public

  # Did the latest release actually reach users, and does it work?
  #
  # This runs even when `publish` fails or is skipped — that is the entire point.
  # v0.4.0 was tagged and released on GitHub, the publish job died at the test
  # step, and nothing ever reached npm. The workflow went red and it was missed
  # for weeks, because a red X only helps if someone looks at it. This job asks
  # the question from the outside — "is the released version on npm, and does it
  # run?" — and opens an issue when the answer is no.
  #
  # It is deliberately independent of how publish reported itself. A step exiting
  # 0 is a claim; resolving the package from the registry and booting it is
  # evidence.
  verify:
    needs: publish
    if: always() && needs.publish.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Which version should be live?
        id: expected
        run: |
          # Same reasoning as the publish job: a query that fails is not a
          # licence to skip the check. This guard exists precisely to catch a
          # release that silently never shipped, so it must never pass by
          # failing to look.
          if ! RESPONSE=$(gh api graphql -f query='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){ latestRelease{ tagName } }
            }' -F owner="${{ github.repository_owner }}" -F name="${GITHUB_REPOSITORY#*/}" 2>&1); then
            echo "::error::Could not query the latest release: ${RESPONSE}. Refusing to report a release verified when it was never checked."
            exit 1
          fi
          TAG=$(echo "$RESPONSE" | jq -r '.data.repository.latestRelease.tagName // ""')
          if [ -z "$TAG" ]; then
            echo "No releases exist yet — nothing to verify."
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "check=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.expected.outputs.check == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      # Users install with whatever npm is current, not the pinned npm the
      # publish job uses. Installing as they do is the only way this catches an
      # npm-version-specific break: npm 12 made dependency lifecycle scripts
      # opt-in, which silently produced an installable-but-crashing package.
      - if: steps.expected.outputs.check == 'true'
        name: Use the npm a real user would have
        run: npm install -g npm@latest && npm --version

      - if: steps.expected.outputs.check == 'true'
        name: Is ${{ steps.expected.outputs.tag }} resolvable from npm?
        id: resolve
        run: |
          VERSION="${{ steps.expected.outputs.version }}"
          # The registry takes a moment to serve a new version. Retry so a
          # propagation delay isn't reported as a failed release — but bound it,
          # because "eventually" is not a release guarantee.
          for i in $(seq 1 10); do
            if npm view "@openmem/mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              echo "@openmem/mcp@${VERSION} is live on npm."
              exit 0
            fi
            echo "attempt ${i}/10: not on npm yet, waiting 15s..."
            sleep 15
          done
          echo "resolved=false" >> "$GITHUB_OUTPUT"
          echo "::error::Release ${VERSION} is NOT on npm after 150s. The GitHub release exists but users cannot install it."
          exit 1

      # Resolving proves the metadata is there. It does not prove the package
      # works — a published-but-broken package is the failure that actually
      # reached users last time.
      - if: steps.expected.outputs.check == 'true'
        name: Install it clean and run it, as a user would
        run: |
          VERSION="${{ steps.expected.outputs.version }}"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null 2>&1
          npm install "@openmem/mcp@${VERSION}" 2>&1 | tail -3

          # The CLI must actually create a database. This is the exact call that
          # crashed with "Could not locate the bindings file" when the package
          # shipped without a usable native binary — an error no amount of
          # registry metadata would have revealed.
          npx openmemory init ./data
          test -f ./data/memory.db || {
            echo "::error::@openmem/mcp@${VERSION} installed but 'openmemory init' produced no database. The published package is broken."
            exit 1
          }
          echo "Smoke test passed: installed from npm and created a database."

      - name: Open an issue if the release never landed
        if: failure() && steps.expected.outputs.check == 'true'
        run: |
          TITLE="Release ${{ steps.expected.outputs.tag }} is not usable from npm"
          # One issue per broken release, not one per re-run.
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // ""')
          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} already open for this release."
            exit 0
          fi
          gh issue create --repo ${{ github.repository }} \
            --title "$TITLE" \
            --assignee gordonkjlee \
            --body "The GitHub release **${{ steps.expected.outputs.tag }}** exists, but verification failed: the version could not be installed from npm and run.

          Users installing \`@openmem/mcp\` are not getting this release. A tagged release that never reached the registry has gone unnoticed before — this issue exists so it cannot happen silently again.

          Run that failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check, in order:
          1. Did the publish job run at all, or did it fail earlier (tests, install)?
          2. Is \`npm view @openmem/mcp@${{ steps.expected.outputs.version }} version\` empty?
          3. Did the package publish but fail to run — i.e. installable but broken?"
        env:
          GH_TOKEN: ${{ github.token }}
