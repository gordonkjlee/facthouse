name: Publish to npm

on:
  workflow_run:
    # Must match the `name:` in release-please.yml exactly
    workflows: ["Release Please"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment: npm
    outputs:
      found: ${{ steps.release.outputs.found }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      processing: ${{ steps.release.outputs.processing }}
      accepted: ${{ steps.publish_pkg.outputs.accepted }}
    steps:
      - name: Find unpublished release
        id: release
        run: |
          # GraphQL, not `gh api repos/.../releases/latest`. The REST call cannot
          # distinguish "no releases exist" from "could not ask": both yield an
          # empty string, and the empty string used to mean "nothing to publish,
          # exit 0 green". During a GitHub REST incident (2026-07-16) that call
          # returned empty on 5 of 5 attempts while GraphQL answered correctly —
          # so a release would have been silently skipped by a job reporting
          # success. That is the v0.4.0 failure wearing a different hat.
          #
          # A null latestRelease is a real answer (no releases yet). A failed
          # query is not an answer, and must stop the workflow rather than be
          # read as "nothing to do".
          if ! RESPONSE=$(gh api graphql -f query='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){ latestRelease{ tagName } }
            }' -F owner="${{ github.repository_owner }}" -F name="${GITHUB_REPOSITORY#*/}" 2>&1); then
            echo "::error::Could not query the latest release: ${RESPONSE}. Refusing to assume there is nothing to publish."
            exit 1
          fi
          TAG=$(echo "$RESPONSE" | jq -r '.data.repository.latestRelease.tagName // ""')
          if [ -z "$TAG" ]; then
            echo "No releases exist yet — nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "processing=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Three states, because a 404 from `npm view` is no longer "not
          # published". npm scans at publish time (typically ~5 minutes, up to
          # 15+ at peak) and prints "Your package is being processed…". During
          # that window `npm view pkg@version` 404s while the version is already
          # accepted — a second run that treats the 404 as "publish me" will
          # 403 over the in-flight version. dist-tag continues to work while
          # scanning; if it already names this version, do not republish.
          if npm view "@factmem/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "$TAG already on npm as @factmem/mcp"
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "processing=false" >> "$GITHUB_OUTPUT"
          elif npm dist-tag ls @factmem/mcp 2>/dev/null | grep -qE ": ${VERSION}$"; then
            echo "$TAG accepted by npm (dist-tag) but not yet resolvable — still processing. Will not republish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "processing=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG not on npm — publishing"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "processing=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.release.outputs.found == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - if: steps.release.outputs.found == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) requires npm >= 11.5.1, and Node 22 ships npm
      # 10.x — so npm must be upgraded explicitly. That is the ONLY reason for
      # this step; keep it as long as the pinned Node ships npm < 11.5.1.
      #
      # The 11.x pin is no longer about npm 12's install-script blocking: this
      # package has no native dependencies and runs no install scripts, so npm
      # 12 is safe here. The pin simply keeps the publish path on a known-good
      # npm rather than tracking @latest through breaking changes.
      - if: steps.release.outputs.found == 'true'
        name: Upgrade npm for trusted publishing
        run: |
          npm install -g "npm@^11.5.1"
          npm --version

      - if: steps.release.outputs.found == 'true'
        name: Install dependencies
        run: npm ci  # `prepare` script runs tsc after install

      - if: steps.release.outputs.found == 'true'
        name: Run tests
        run: npm test

      # No NODE_AUTH_TOKEN: authentication comes from the OIDC id-token above,
      # matched against the Trusted Publisher configured on npmjs.com for this
      # package (owner/repo + workflow filename + environment must match exactly).
      # Provenance is generated automatically under trusted publishing.
      - if: steps.release.outputs.found == 'true'
        id: publish_pkg
        name: Publish ${{ steps.release.outputs.tag }}
        run: |
          # A 403 "cannot publish over the previously published versions" means
          # npm already accepted this version — live, or still in the publish-time
          # scan. Treating that as failure would turn a concurrent workflow_run
          # (or a retry while scanning) into a red X for a package that is fine.
          set +e
          LOG=$(npm publish --provenance --access public 2>&1)
          STATUS=$?
          set -e
          echo "$LOG"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$LOG" | grep -qi 'cannot publish over the previously published'; then
              echo "npm already accepted @factmem/mcp at this version (live or still processing)."
            else
              exit "$STATUS"
            fi
          fi
          # Linger: same tarball under @openmem/mcp so pinned mcp.json keeps working.
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.name='@openmem/mcp'; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');"
          set +e
          LOG2=$(npm publish --provenance --access public 2>&1)
          STATUS2=$?
          set -e
          echo "$LOG2"
          if [ "$STATUS2" -ne 0 ]; then
            if echo "$LOG2" | grep -qi 'cannot publish over the previously published'; then
              echo "npm already accepted @openmem/mcp at this version (live or still processing)."
            else
              exit "$STATUS2"
            fi
          fi
          echo "accepted=true" >> "$GITHUB_OUTPUT"

  # Did the latest release actually reach users, and does it work?
  #
  # This runs even when `publish` fails or is skipped — that is the entire point.
  # v0.4.0 was tagged and released on GitHub, the publish job died at the test
  # step, and nothing ever reached npm. The workflow went red and it was missed
  # for weeks, because a red X only helps if someone looks at it. This job asks
  # the question from the outside — "is the released version on npm, and does it
  # run?" — and opens an issue when the answer is no.
  #
  # It is deliberately independent of how publish reported itself. A step exiting
  # 0 is a claim; resolving the package from the registry and booting it is
  # evidence.
  verify:
    needs: publish
    if: always() && needs.publish.result != 'skipped'
    runs-on: ubuntu-latest
    # Must exceed the resolve wait (20 min when we just published) plus setup
    # and the smoke install. A 10-minute job timeout with a 20-minute loop
    # would kill the wait and look like a missing release.
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Which version should be live?
        id: expected
        run: |
          # Same reasoning as the publish job: a query that fails is not a
          # licence to skip the check. This guard exists precisely to catch a
          # release that silently never shipped, so it must never pass by
          # failing to look.
          if ! RESPONSE=$(gh api graphql -f query='
            query($owner:String!,$name:String!){
              repository(owner:$owner,name:$name){ latestRelease{ tagName } }
            }' -F owner="${{ github.repository_owner }}" -F name="${GITHUB_REPOSITORY#*/}" 2>&1); then
            echo "::error::Could not query the latest release: ${RESPONSE}. Refusing to report a release verified when it was never checked."
            exit 1
          fi
          TAG=$(echo "$RESPONSE" | jq -r '.data.repository.latestRelease.tagName // ""')
          if [ -z "$TAG" ]; then
            echo "No releases exist yet — nothing to verify."
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "check=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.expected.outputs.check == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Users install with whatever npm is current, not the pinned npm the
      # publish job uses. Installing as they do is the only way this catches an
      # npm-version-specific break: npm 12 made dependency lifecycle scripts
      # opt-in, which silently produced an installable-but-crashing package.
      - if: steps.expected.outputs.check == 'true'
        name: Use the npm a real user would have
        run: npm install -g npm@latest && npm --version

      - if: steps.expected.outputs.check == 'true'
        name: Is ${{ steps.expected.outputs.tag }} resolvable from npm?
        id: resolve
        run: |
          VERSION="${{ steps.expected.outputs.version }}"
          ACCEPTED="${{ needs.publish.outputs.accepted }}"
          PROCESSING="${{ needs.publish.outputs.processing }}"
          # npm scans packages at publish time before they become installable
          # (typical ~5 minutes, up to 15+ at peak; measured ~7 minutes for
          # 0.16.0 and 0.17.0). The old 150s bound was written for CDN
          # propagation and fires while npm is still printing "being processed".
          # Wait out the documented peak only when this run accepted a publish
          # (or saw a dist-tag for a version `npm view` cannot yet resolve).
          # A publish that never happened must not wait 20 minutes to admit it.
          if [ "$ACCEPTED" = "true" ] || [ "$PROCESSING" = "true" ]; then
            MAX_WAIT=1200
          else
            MAX_WAIT=180
          fi
          echo "Waiting up to ${MAX_WAIT}s for @factmem/mcp@${VERSION} (accepted=${ACCEPTED:-false} processing=${PROCESSING:-false})"
          echo "max_wait=$MAX_WAIT" >> "$GITHUB_OUTPUT"
          DEADLINE=$((SECONDS + MAX_WAIT))
          ATTEMPT=0
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            if OUT=$(npm view "@factmem/mcp@${VERSION}" version 2>&1); then
              echo "resolved=true" >> "$GITHUB_OUTPUT"
              echo "waited=$SECONDS" >> "$GITHUB_OUTPUT"
              echo "@factmem/mcp@${VERSION} is live on npm after ${SECONDS}s ($ATTEMPT attempt(s))."
              exit 0
            fi
            LEFT=$((DEADLINE - SECONDS))
            echo "attempt ${ATTEMPT}: not resolvable after ${SECONDS}s (${LEFT}s left): ${OUT}"
            if [ "$LEFT" -le 0 ]; then
              break
            fi
            SLEEP=30
            if [ "$SLEEP" -gt "$LEFT" ]; then
              SLEEP=$LEFT
            fi
            sleep "$SLEEP"
          done
          echo "resolved=false" >> "$GITHUB_OUTPUT"
          echo "waited=$SECONDS" >> "$GITHUB_OUTPUT"
          echo "::error::Release ${VERSION} is not resolvable from npm after ${SECONDS}s. If npm accepted the publish, it may still be in publish-time scanning — or it never landed."
          exit 1

      # Resolving proves the metadata is there. It does not prove the package
      # works — a published-but-broken package is the failure that actually
      # reached users last time.
      - if: success() && steps.expected.outputs.check == 'true'
        id: smoke
        name: Install it clean and run it, as a user would
        run: |
          VERSION="${{ steps.expected.outputs.version }}"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          npm init -y >/dev/null 2>&1
          npm install "@factmem/mcp@${VERSION}" 2>&1 | tail -3

          # The CLI must actually create a database. This is the exact call that
          # crashed with "Could not locate the bindings file" when the package
          # shipped without a usable native binary — an error no amount of
          # registry metadata would have revealed.
          npx factmem init ./data
          test -f ./data/memory.db || {
            echo "::error::@factmem/mcp@${VERSION} installed but 'factmem init' produced no database. The published package is broken."
            exit 1
          }
          npx openmemory init ./data-shim
          test -f ./data-shim/memory.db || {
            echo "::error::@factmem/mcp@${VERSION} installed but the openmemory CLI shim produced no database."
            exit 1
          }
          echo "Smoke test passed: installed from npm and created a database."

      - name: Open an issue if the release never landed
        if: failure() && steps.expected.outputs.check == 'true'
        run: |
          TAG="${{ steps.expected.outputs.tag }}"
          VERSION="${{ steps.expected.outputs.version }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RESOLVE="${{ steps.resolve.outcome }}"
          PUBLISH_RESULT="${{ needs.publish.result }}"
          ACCEPTED="${{ needs.publish.outputs.accepted }}"
          PROCESSING="${{ needs.publish.outputs.processing }}"
          WAITED="${{ steps.resolve.outputs.waited }}"
          MAX_WAIT="${{ steps.resolve.outputs.max_wait }}"

          BODY_FILE="${RUNNER_TEMP}/issue-body.md"
          if [ "$RESOLVE" != "success" ]; then
            TITLE="Release ${TAG} did not become installable from npm"
            {
              echo "The GitHub release **${TAG}** exists, but npm view @factmem/mcp@${VERSION} version was still empty after waiting **${WAITED:-?}s** (budget ${MAX_WAIT:-?}s)."
              echo
              echo "Publish job result: ${PUBLISH_RESULT}. This run accepted a publish: ${ACCEPTED:-false}. Dist-tag showed an in-flight version: ${PROCESSING:-false}."
              echo
              echo "npm scans packages at publish time before they are installable (typically ~5 minutes, up to 15+ at peak). A wait that ends while scanning is in progress is not proof the release never landed — check the registry before assuming users are stuck on the previous tag."
              echo
              echo "Run that failed: ${RUN_URL}"
              echo
              echo "Check, in order:"
              echo "1. Did the publish job run npm publish, or did it fail earlier (tests, install, auth)?"
              echo "2. Is npm view @factmem/mcp@${VERSION} version empty *now*?"
              echo "3. If publish succeeded and the version is still empty after 20 minutes, npm may be holding the package for review."
            } > "$BODY_FILE"
          else
            TITLE="Release ${TAG} is on npm but failed the install smoke test"
            {
              echo "**${TAG}** resolves from npm, but a clean npm install @factmem/mcp@${VERSION} + factmem init did not produce a database. Users can download this release and it does not run."
              echo
              echo "Publish job result: ${PUBLISH_RESULT}."
              echo
              echo "Run that failed: ${RUN_URL}"
              echo
              echo "The package is on the registry; this is not a processing delay. The smoke test is the same call that previously crashed when a native binary was missing from the tarball."
            } > "$BODY_FILE"
          fi

          # One issue per broken release, not one per re-run. Match the new
          # titles and the older "not usable from npm" wording so a retry of
          # an already-filed release does not open a second issue.
          EXISTING=$(gh issue list --repo ${{ github.repository }} --state open \
            --search "${TAG} in:title" --json number,title \
            --jq '[.[] | select(.title | test("not usable from npm|did not become installable|failed the install smoke test")) | .number] | .[0] // empty')
          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} already open for this release."
            exit 0
          fi
          gh issue create --repo ${{ github.repository }} \
            --title "$TITLE" \
            --assignee gordonkjlee \
            --body-file "$BODY_FILE"
        env:
          GH_TOKEN: ${{ github.token }}
