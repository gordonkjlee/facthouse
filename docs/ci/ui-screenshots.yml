name: ui-screenshots

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ui-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save @playwright/test@1 && npx playwright install --with-deps chromium
      # Synthetic payloads only; no FACTHOUSE_* store variables in this job.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: test-results/ui/
